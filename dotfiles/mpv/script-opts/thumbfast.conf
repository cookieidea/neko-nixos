## thumbfast 配置（官方跨平台版，Linux 用 unix socket 文件）

# Socket 路径（留空自动，官方自动追加 pid）
socket=
# 缩略图输出路径（留空自动：/tmp/thumbfast.out + pid）
thumbnail=

# 缩略图最大尺寸（像素）
max_height=256
max_width=256

# 播放器渲染缩放（需 mpv 0.38+）
scale_factor=1

# 色调映射（auto/yes/no），HDR 视频缩略图
tone_mapping=auto

# overlay id，别动
overlay_id=42

# 加载文件即生成缩略图
spawn_first=yes
# 空闲超时退出缩略图进程（秒，0=不退出）
quit_after_inactivity=0
# 流媒体启用缩略图
network=no
# 音频文件启用缩略图
audio=no

# 解码 API（yes/copy/no；缩略图进程硬解，AMD 建议 copy 防花屏）
hwdec=yes
# 自定义 mpv 路径（默认自动）
mpv_path=default
