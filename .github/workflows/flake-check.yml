name: flake-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # 固定 Nix 版本，避免上游行为漂移导致 CI 无常失败
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            # 本仓库的 flake 依赖国内镜像（NJU/gitcode）与自己声明的缓存，
            # CI 上按原样使用即可；此处不做替换，以免与本地求值结果不一致。

      # 只跑 checks（静态分析：deadnix），不构建整个系统。
      # 系统闭包含 ROCm/Steam 等重量级依赖，CI runner 磁盘与时长都不适合完整构建。
            - name: nix flake check
        run: nix flake check -L

      # 求值系统 toplevel：nix flake check 只跑 checks 里的 derivation，
      # 不保证 nixosConfigurations.<host> 能否构建。此步只做 eval（不 build），
      # 能拦住「eval 过但 build 炸」这类问题，耗时与资源都远小于完整构建。
      - name: eval nixosConfiguration toplevel
        run: |
          nix eval --impure --raw --expr \
            '(builtins.getFlake "${{ github.workspace }}").nixosConfigurations.ATRI.config.system.build.toplevel.drvPath' \
            > /tmp/toplevel.drv
          echo "toplevel drv: $(cat /tmp/toplevel.drv)"
          test -s /tmp/toplevel.drv

      # 暂不在 CI 强制 nixfmt，避免一次性格式化大量历史配置。
      # 需要时本地执行：nix fmt .
